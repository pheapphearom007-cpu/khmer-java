services:
  - type: web
    name: khmer-java-academy
    runtime: node
    plan: free
    region: singapore # Nearest low-latency region for Cambodian learners
    buildCommand: npm install --production=false --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 10000
      - key: AI_TUTOR_PROVIDER
        value: gemini
      # Configure in your Render Dashboard:
      - key: GEMINI_API_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
